<div class="panel" style="margin-bottom: 24px; scroll-margin-top: 80px;" id="architecture-blueprint">
    <div class="panel-header" style="border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
      <div class="panel-title">🧠 Architecture Blueprint <span class="info-icon" data-tooltip="The engine's holistic semantic understanding of your codebase, generated deterministically from your files and rules.">?</span></div>
    </div>
    
    <div class="grid-2" style="margin-bottom: 0;">
      <!-- Synopsis -->
      <div>
        <h4 style="color:var(--text2);font-family:var(--mono);margin-bottom:8px;font-size:12px;text-transform:uppercase;">Holistic Project Synopsis</h4>
        <div id="archSynopsis" style="color:var(--text);font-size:13px;line-height:1.6;background:var(--bg2);padding:16px;border-radius:8px;border:1px solid var(--border);height: 100%;max-height: 400px;overflow-y: auto;">Loading synopsis...</div>
      </div>
      
      <!-- Build Plan -->
      <div>
        <h4 style="color:var(--green);font-family:var(--mono);margin-bottom:8px;font-size:12px;text-transform:uppercase;">Active Build Plan</h4>
        <div id="archBuildPlan" style="background:var(--bg2);border:1px dashed var(--border);padding:16px;border-radius:8px;color:var(--text3);font-size:13px;line-height:1.6;height: 100%;max-height: 400px;overflow-y: auto;">Awaiting engine initialization...</div>
      </div>
    </div>
  </div>
