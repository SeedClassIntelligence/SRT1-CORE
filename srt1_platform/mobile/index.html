<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#06080f">
    <meta name="description" content="SRT-1 Mobile — Plant seeds from anywhere">
    <title>SRT-1 Mobile</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #06080f;
            --bg-card: #0d1117;
            --bg-surface: #161b22;
            --bg-hover: #1c2333;
            --border: #21262d;
            --border-light: #30363d;
            --text: #f0f6fc;
            --text-secondary: #c9d1d9;
            --text-muted: #8b949e;
            --text-dim: #6e7681;
            --blue: #58a6ff;
            --cyan: #39d0d8;
            --teal: #2dd4bf;
            --green: #3fb950;
            --amber: #d29922;
            --red: #f85149;
            --purple: #bc8cff;
            --pink: #f778ba;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(63,185,80,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(57,208,216,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(6,8,15,0.92);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-bottom: 1px solid var(--border);
            padding: calc(var(--safe-top) + 12px) 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 32px; height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 13px; color: #000;
        }

        .app-name {
            font-size: 17px; font-weight: 800;
            letter-spacing: -0.3px;
        }

        .app-name span {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-dim);
            margin-left: 6px;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
            transition: background 0.3s;
        }

        .status-dot.live {
            background: var(--green);
            box-shadow: 0 0 8px rgba(63,185,80,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── MAIN ── */
        .main {
            position: relative;
            z-index: 1;
            padding: 16px 16px calc(var(--safe-bottom) + 80px);
            max-width: 500px;
            margin: 0 auto;
        }

        /* ── PLANT SEED CARD ── */
        .plant-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .plant-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--green), var(--teal), var(--blue));
        }

        .plant-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .plant-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 12px;
            -webkit-appearance: none;
            appearance: none;
        }

        .plant-input:focus { border-color: var(--green); }
        .plant-input::placeholder { color: var(--text-dim); }

        .plant-row {
            display: flex;
            gap: 8px;
        }

        .plant-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: #000;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .plant-btn:active {
            transform: scale(0.97);
        }

        .plant-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .priority-select {
            padding: 14px 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            min-width: 60px;
            text-align: center;
        }

        /* ── FARM STATS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
        }

        .stat-num {
            font-size: 22px;
            font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ── ACTIVE SEED ── */
        .active-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .active-head {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .active-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }

        .active-stage {
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            text-transform: uppercase;
        }

        .active-body {
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .active-body.empty {
            justify-content: center;
            color: var(--text-dim);
            font-size: 14px;
            padding: 28px 16px;
        }

        /* Growth Ring */
        .growth-ring {
            position: relative;
            width: 68px; height: 68px;
            flex-shrink: 0;
        }

        .growth-ring svg { width: 100%; height: 100%; }

        .gr-bg, .gr-fill {
            fill: none; stroke-width: 5; stroke-linecap: round;
        }
        .gr-bg { stroke: var(--border); }
        .gr-fill {
            stroke: var(--green);
            transition: stroke-dashoffset 1s ease-out, stroke 0.3s;
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .gr-center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .gr-pct {
            font-size: 16px; font-weight: 900;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .gr-emoji { font-size: 11px; margin-top: 2px; }

        .active-info { flex: 1; min-width: 0; }

        .active-intent {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .active-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── LIFECYCLE ── */
        .lifecycle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .lc-bar {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .lc-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .lc-dot {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            transition: all 0.4s;
        }

        .lc-dot.active {
            border-color: var(--green);
            background: rgba(63,185,80,0.12);
            box-shadow: 0 0 16px rgba(63,185,80,0.35);
            animation: lc-glow 2s infinite;
        }

        .lc-dot.done {
            border-color: var(--teal);
            background: rgba(45,212,191,0.12);
        }

        .lc-dot.future { opacity: 0.3; }

        @keyframes lc-glow {
            0%, 100% { box-shadow: 0 0 16px rgba(63,185,80,0.35); }
            50% { box-shadow: 0 0 24px rgba(63,185,80,0.55); }
        }

        .lc-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-dim);
        }

        .lc-label.active { color: var(--green); }
        .lc-label.done { color: var(--teal); }

        .lc-line {
            flex: 1;
            height: 2px;
            background: var(--border);
            margin-bottom: 18px;
            z-index: 1;
            transition: background 0.4s;
        }

        .lc-line.done {
            background: linear-gradient(90deg, var(--teal), var(--green));
        }

        /* ── SEED LIST ── */
        .seed-list {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .seed-list-head {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .seed-list-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }

        .seed-count {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(63,185,80,0.1);
            color: var(--green);
            font-weight: 700;
        }

        .seed-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(33,38,45,0.5);
            transition: background 0.15s;
        }

        .seed-item:last-child { border-bottom: none; }
        .seed-item:active { background: var(--bg-hover); }

        .seed-emoji { font-size: 18px; flex-shrink: 0; }

        .seed-info { flex: 1; min-width: 0; }

        .seed-intent {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seed-detail {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .seed-growth-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            min-width: 40px;
            text-align: right;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 90px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            z-index: 200;
            opacity: 0;
            transition: all 0.3s ease-out;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── PULL TO REFRESH ── */
        .pull-indicator {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: var(--text-dim);
            transition: transform 0.2s;
        }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: rgba(6,8,15,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 8px 0 calc(var(--safe-bottom) + 8px);
            display: flex;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: var(--text-dim);
            font-weight: 600;
            padding: 4px 16px;
            border: none;
            background: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active { color: var(--green); }
        .nav-item .nav-icon { font-size: 20px; }

        /* ── LOADING ── */
        .loading-shimmer {
            background: linear-gradient(90deg,
                var(--bg-card) 25%,
                var(--bg-surface) 50%,
                var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            height: 20px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── RESPONSIVE ── */
        @media (min-width: 500px) {
            .main { padding: 20px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <div class="logo">S1</div>
        <div class="app-name">SRT-1 <span>Mobile</span></div>
    </div>
    <div class="status-dot" id="statusDot"></div>
</header>

<main class="main" id="mainContent">

    <!-- PLANT SEED -->
    <div class="plant-card">
        <div class="plant-label">🌱 Plant a Seed</div>
        <input type="text" class="plant-input" id="seedInput"
               placeholder="What should I build?"
               enterkeyhint="send"
               autocomplete="off"
               autocapitalize="sentences">
        <div class="plant-row">
            <button class="plant-btn" id="plantBtn" onclick="plantSeed()">
                🌱 Plant
            </button>
            <select class="priority-select" id="prioritySelect">
                <option value="3">P3</option>
                <option value="5" selected>P5</option>
                <option value="7">P7</option>
                <option value="9">P9</option>
            </select>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-num" id="stTotal" style="color:var(--blue);">—</div>
            <div class="stat-label">Seeds</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stActive" style="color:var(--green);">—</div>
            <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stBloomed" style="color:var(--purple);">—</div>
            <div class="stat-label">Bloomed</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="stRate" style="color:var(--cyan);">—</div>
            <div class="stat-label">Success</div>
        </div>
    </div>

    <!-- ACTIVE SEED -->
    <div class="active-card">
        <div class="active-head">
            <div class="active-title">Active Seed</div>
            <div class="active-stage" id="activeStage">—</div>
        </div>
        <div class="active-body empty" id="activeBody">
            🌱 No active seed
        </div>
    </div>

    <!-- LIFECYCLE -->
    <div class="lifecycle">
        <div class="lc-bar">
            <div class="lc-node">
                <div class="lc-dot future" id="m-lc-planted">🌱</div>
                <div class="lc-label" id="m-lbl-planted">Planted</div>
            </div>
            <div class="lc-line" id="m-line-1"></div>
            <div class="lc-node">
                <div class="lc-dot future" id="m-lc-germinating">🌿</div>
                <div class="lc-label" id="m-lbl-germinating">Germinate</div>
            </div>
            <div class="lc-line" id="m-line-2"></div>
            <div class="lc-node">
                <div class="lc-dot future" id="m-lc-growing">🌳</div>
                <div class="lc-label" id="m-lbl-growing">Growing</div>
            </div>
            <div class="lc-line" id="m-line-3"></div>
            <div class="lc-node">
                <div class="lc-dot future" id="m-lc-bloomed">🌸</div>
                <div class="lc-label" id="m-lbl-bloomed">Bloomed</div>
            </div>
        </div>
    </div>

    <!-- SEED LIST -->
    <div class="seed-list">
        <div class="seed-list-head">
            <div class="seed-list-title">Seed History</div>
            <div class="seed-count" id="seedCountBadge">0</div>
        </div>
        <div id="seedListBody">
            <div class="seed-item" style="justify-content:center; color:var(--text-dim); padding:24px;">
                Loading seeds...
            </div>
        </div>
    </div>

</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="scrollTo({top:0,behavior:'smooth'})">
        <span class="nav-icon">🌱</span>
        Plant
    </button>
    <button class="nav-item" onclick="loadAll()">
        <span class="nav-icon">🔄</span>
        Refresh
    </button>
    <button class="nav-item" onclick="window.location='/dashboard'">
        <span class="nav-icon">📊</span>
        Dashboard
    </button>
</nav>

<script>
// ── Config ──
const API = window.location.origin || 'http://127.0.0.1:7483';
let authToken = localStorage.getItem('srt1_token') || '';

function headers() {
    const h = { 'Content-Type': 'application/json' };
    if (authToken) h['Authorization'] = `Bearer ${authToken}`;
    return h;
}

// ── Toast ──
function toast(msg, duration = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
}

// ── Plant Seed ──
async function plantSeed() {
    const input = document.getElementById('seedInput');
    const btn = document.getElementById('plantBtn');
    const intent = input.value.trim();
    if (!intent) { input.focus(); return; }

    btn.disabled = true;
    btn.innerHTML = '⏳ Planting...';

    try {
        const r = await fetch(`${API}/seeds`, {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({
                intent: intent,
                source: 'mobile',
                priority: parseInt(document.getElementById('prioritySelect').value),
                auto_dispatch: true,
            }),
        });
        const d = await r.json();

        if (d.status === 'seed_planted') {
            input.value = '';
            toast(`🌱 Seed planted! ${d.seed?.stage_emoji || ''}`);
            // Haptic feedback
            if (navigator.vibrate) navigator.vibrate(50);
            loadAll();
        } else {
            toast(`❌ ${d.error || 'Failed to plant'}`);
        }
    } catch (e) {
        // Fallback to /task
        try {
            await fetch(`${API}/task`, {
                method: 'POST',
                headers: headers(),
                body: JSON.stringify({ task: intent }),
            });
            input.value = '';
            toast('🌱 Seed planted via task!');
            loadAll();
        } catch (e2) {
            toast('❌ Could not connect to SRT-1');
        }
    }

    btn.disabled = false;
    btn.innerHTML = '🌱 Plant';
}

// ── Load Stats ──
async function loadStats() {
    try {
        const r = await fetch(`${API}/seeds/stats`, { headers: headers() });
        const d = await r.json();

        document.getElementById('stTotal').textContent = d.total_seeds || 0;
        document.getElementById('stActive').textContent = d.active || 0;
        document.getElementById('stBloomed').textContent = d.bloomed || 0;
        document.getElementById('stRate').textContent = d.success_rate ? d.success_rate + '%' : '—';
    } catch (e) {}
}

// ── Load Active Seed ──
async function loadActive() {
    try {
        const r = await fetch(`${API}/seeds/active`, { headers: headers() });
        const d = await r.json();

        const body = document.getElementById('activeBody');
        const stageEl = document.getElementById('activeStage');

        if (d && d.seed_id) {
            const growth = d.growth || 0;
            const circ = 2 * Math.PI * 26;
            const offset = circ - (circ * growth / 100);

            let ringColor = 'var(--green)';
            if (growth >= 100) ringColor = 'var(--purple)';
            else if (growth >= 50) ringColor = 'var(--cyan)';
            else if (growth >= 25) ringColor = 'var(--teal)';

            stageEl.textContent = `${d.stage_emoji || '🌱'} ${d.stage || 'planted'}`;

            let timeStr = '';
            if (d.created_at) {
                const mins = Math.floor((Date.now() - new Date(d.created_at)) / 60000);
                if (mins < 1) timeStr = 'just now';
                else if (mins < 60) timeStr = `${mins}m ago`;
                else if (mins < 1440) timeStr = `${Math.floor(mins/60)}h ago`;
                else timeStr = `${Math.floor(mins/1440)}d ago`;
            }

            body.className = 'active-body';
            body.innerHTML = `
                <div class="growth-ring">
                    <svg viewBox="0 0 68 68">
                        <circle class="gr-bg" cx="34" cy="34" r="26" stroke-dasharray="${circ}"/>
                        <circle class="gr-fill" cx="34" cy="34" r="26"
                            stroke-dasharray="${circ}"
                            stroke-dashoffset="${offset}"
                            style="stroke:${ringColor};"/>
                    </svg>
                    <div class="gr-center">
                        <div class="gr-pct" style="color:${ringColor};">${growth}%</div>
                        <div class="gr-emoji">${d.stage_emoji || '🌱'}</div>
                    </div>
                </div>
                <div class="active-info">
                    <div class="active-intent">${d.intent}</div>
                    <div class="active-meta">
                        <span>📱 ${d.source || 'api'}</span>
                        ${timeStr ? `<span>⏱ ${timeStr}</span>` : ''}
                        <span>📁 ${d.files_modified?.length || 0} files</span>
                    </div>
                </div>
            `;

            // Update lifecycle
            updateLifecycle(d.stage);
        } else {
            body.className = 'active-body empty';
            body.innerHTML = '🌱 No active seed — plant one above!';
            stageEl.textContent = '—';
            resetLifecycle();
        }
    } catch (e) {
        document.getElementById('activeBody').className = 'active-body empty';
        document.getElementById('activeBody').innerHTML = '⏳ Connecting...';
    }
}

// ── Lifecycle ──
function updateLifecycle(stage) {
    const stages = ['planted', 'germinating', 'growing', 'bloomed'];
    const idx = stages.indexOf(stage);

    stages.forEach((s, i) => {
        const dot = document.getElementById(`m-lc-${s}`);
        const lbl = document.getElementById(`m-lbl-${s}`);
        if (i < idx) {
            dot.className = 'lc-dot done';
            lbl.className = 'lc-label done';
        } else if (i === idx) {
            dot.className = 'lc-dot active';
            lbl.className = 'lc-label active';
        } else {
            dot.className = 'lc-dot future';
            lbl.className = 'lc-label';
        }

        if (i < 3) {
            const line = document.getElementById(`m-line-${i+1}`);
            line.className = i < idx ? 'lc-line done' : 'lc-line';
        }
    });
}

function resetLifecycle() {
    ['planted','germinating','growing','bloomed'].forEach(s => {
        document.getElementById(`m-lc-${s}`).className = 'lc-dot future';
        document.getElementById(`m-lbl-${s}`).className = 'lc-label';
    });
    [1,2,3].forEach(i => {
        document.getElementById(`m-line-${i}`).className = 'lc-line';
    });
}

// ── Seed List ──
async function loadSeeds() {
    try {
        const r = await fetch(`${API}/seeds`, { headers: headers() });
        const d = await r.json();
        const seeds = d.seeds || [];

        document.getElementById('seedCountBadge').textContent = seeds.length;

        const body = document.getElementById('seedListBody');
        if (seeds.length === 0) {
            body.innerHTML = '<div class="seed-item" style="justify-content:center;color:var(--text-dim);padding:24px;">No seeds yet. Plant your first one! 🌱</div>';
            return;
        }

        body.innerHTML = seeds.slice(0, 20).map(s => {
            const gc = s.growth >= 100 ? 'var(--purple)' :
                       s.growth >= 50 ? 'var(--cyan)' :
                       s.growth > 0 ? 'var(--green)' : 'var(--amber)';
            return `
                <div class="seed-item">
                    <div class="seed-emoji">${s.stage_emoji || '🌱'}</div>
                    <div class="seed-info">
                        <div class="seed-intent">${s.intent}</div>
                        <div class="seed-detail">${s.source || 'api'} · ${s.stage}</div>
                    </div>
                    <div class="seed-growth-badge" style="color:${gc}">${s.growth}%</div>
                </div>
            `;
        }).join('');
    } catch (e) {
        document.getElementById('seedListBody').innerHTML =
            '<div class="seed-item" style="justify-content:center;color:var(--text-dim);padding:24px;">⏳ Connecting...</div>';
    }
}

// ── Status ──
async function checkStatus() {
    try {
        const r = await fetch(`${API}/health`, { headers: headers() });
        const d = await r.json();
        document.getElementById('statusDot').className = 'status-dot live';
    } catch (e) {
        document.getElementById('statusDot').className = 'status-dot';
    }
}

// ── Load All ──
async function loadAll() {
    checkStatus();
    loadStats();
    loadActive();
    loadSeeds();
}

// ── Enter key to plant ──
document.getElementById('seedInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') plantSeed();
});

// ── Init ──
loadAll();
setInterval(loadAll, 10000);
</script>

</body>
