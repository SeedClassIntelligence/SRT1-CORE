<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SRT-1 Standard Experience</title>
<style>
:root {
  --bg: #090b10;
  --surface: #11151d;
  --surface-2: #161b24;
  --surface-3: #1b2230;
  --text: #f4f7fb;
  --soft: #d8e0eb;
  --muted: #9aa4b2;
  --quiet: #687487;
  --line: #27303d;
  --brand: #4ee1a0;
  --blue: #36b6ff;
  --warn: #ffb454;
  --success: #57d48b;
  --danger: #ff7575;
  --shadow: 0 28px 70px rgba(0, 0, 0, .35);
  --lane: 920px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 8% 0%, rgba(78, 225, 160, .07), transparent 25%),
    radial-gradient(circle at 92% 0%, rgba(54, 182, 255, .06), transparent 24%),
    var(--bg);
  overflow: hidden;
}

button, textarea, input { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }

.shell {
  height: 100%;
  width: 100vw;
  overflow: hidden;
  display: grid;
  grid-template-rows: 64px 1fr;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 0 max(22px, calc((100vw - var(--lane)) / 2));
  border-bottom: 1px solid var(--line);
  background: rgba(9, 11, 16, .92);
  backdrop-filter: blur(16px);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #07110c;
  font-weight: 900;
  background: linear-gradient(135deg, var(--brand), #8cf2c6);
  flex: 0 0 auto;
}

.brand-copy {
  min-width: 0;
}

.brand-copy strong,
.brand-copy span {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-copy strong { font-size: 15px; }
.brand-copy span { color: var(--muted); font-size: 11px; margin-top: 2px; }

.project-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  margin-left: 4px;
  max-width: min(38vw, 320px);
}

.project-trigger span:nth-child(2) {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  flex: 0 0 auto;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ghost,
.card-btn,
.tool {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 11px;
}

.ghost {
  padding: 8px 11px;
  text-decoration: none;
  font-size: 13px;
}

.ghost:hover,
.card-btn:hover,
.tool:hover {
  color: var(--text);
  border-color: rgba(78, 225, 160, .45);
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-3);
  border: 1px solid var(--line);
  font-weight: 800;
  font-size: 12px;
}

.workspace {
  position: relative;
  overflow: hidden;
  width: 100%;
  min-width: 0;
  padding: 10px 14px 12px;
}

.conversation {
  position: absolute;
  left: 50%;
  top: 10px;
  bottom: 12px;
  transform: translateX(-50%);
  width: min(var(--lane), calc(100vw - 28px));
  max-width: calc(100vw - 28px);
  min-width: 0;
  height: auto;
  margin: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 12px;
}

.thread {
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 3px 10px;
  scrollbar-width: thin;
  scrollbar-color: #303949 transparent;
}

.message {
  display: flex;
  margin: 0 0 12px;
  gap: 10px;
  align-items: flex-start;
}

.message.user {
  justify-content: flex-end;
}

.message.user .speaker {
  display: none;
}

.speaker {
  display: none;
}

.bubble {
  max-width: 76%;
  padding: 11px 14px;
  border-radius: 15px;
  line-height: 1.52;
  font-size: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--soft);
  white-space: pre-line;
}

.message.user .bubble {
  background: linear-gradient(135deg, #17342b, #153547);
  border-color: #2d5d4b;
  border-bottom-right-radius: 5px;
  color: var(--text);
}

.message.ai .bubble {
  border-bottom-left-radius: 5px;
}

.context-card {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  margin: 0 0 12px;
  background: linear-gradient(145deg, #141a23, #10141b);
  border: 1px solid #344054;
  border-radius: 17px;
  padding: 14px;
}

.context-card.ready {
  border-color: rgba(87, 212, 139, .48);
}

.context-card.warn {
  border-color: rgba(255, 180, 84, .45);
}

.context-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 8px;
}

.context-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: rgba(255, 180, 84, .10);
  color: var(--warn);
  font-weight: 900;
}

.context-card.ready .context-icon {
  background: rgba(87, 212, 139, .10);
  color: var(--success);
}

.context-head h3 {
  margin: 0;
  font-size: 14px;
}

.context-head .meta {
  margin-left: auto;
  color: var(--muted);
  font-size: 10px;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.context-card p {
  overflow-wrap: anywhere;
  margin: 0 0 11px;
  color: #d8e0eb;
  font-size: 12px;
  line-height: 1.5;
}

.context-facts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0 12px;
}

.context-fact {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 11px;
}

.context-fact strong {
  display: block;
  font-size: 12px;
  color: var(--text);
  overflow-wrap: anywhere;
}

.context-fact span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}

.context-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.card-btn {
  padding: 8px 11px;
  background: var(--surface-2);
  color: var(--text);
  font-weight: 700;
  font-size: 11px;
}

.card-btn.primary {
  background: var(--brand);
  color: #07110c;
  border-color: transparent;
}

.card-btn.danger {
  color: var(--danger);
}

.insight {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  margin: 0 0 12px;
  background: #101821;
  border: 1px solid #26384d;
  border-radius: 14px;
  padding: 11px 13px;
  font-size: 12px;
  line-height: 1.5;
  color: #d8e1ec;
}

.insight b {
  color: var(--blue);
}

.composer {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow: hidden;
  background: rgba(17, 21, 29, .98);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 8px;
  box-shadow: var(--shadow);
}

.composer textarea {
  width: 100%;
  min-height: 58px;
  max-height: 140px;
  resize: vertical;
  background: transparent;
  border: 0;
  outline: 0;
  color: var(--text);
  padding: 8px 10px;
  line-height: 1.45;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.composer textarea::placeholder {
  color: var(--quiet);
}

.composer-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 3px 0;
}

.composer-tools {
  display: flex;
  gap: 6px;
}

.tool {
  width: 31px;
  height: 31px;
  border-radius: 10px;
  background: var(--surface-2);
  font-weight: 850;
}

.send {
  border: 0;
  border-radius: 11px;
  padding: 9px 14px;
  font-weight: 850;
  color: #07110c;
  background: linear-gradient(135deg, var(--brand), #7af0bd);
}

.project-menu {
  position: fixed;
  top: 56px;
  left: 84px;
  width: min(336px, calc(100vw - 28px));
  background: #11161f;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 9px;
  box-shadow: var(--shadow);
  display: none;
  z-index: 30;
}

.project-menu.open {
  display: block;
}

.project-option {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 10px 11px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 9px;
  color: #dce3ed;
  font-size: 12px;
  text-align: left;
}

.project-option:hover {
  background: var(--surface-2);
}

.project-option small {
  margin-left: auto;
  color: var(--muted);
  white-space: nowrap;
}

.menu-label {
  color: #6f7b8d;
  font-size: 9px;
  font-weight: 850;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 9px 6px;
}

.path-entry {
  display: none;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 7px;
  padding: 8px;
}

.path-entry.open {
  display: grid;
}

.path-entry input {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  padding: 8px 10px;
  outline: 0;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  .brand-copy span,
  .top-actions .ghost:first-child {
    display: none;
  }
  .topbar {
    padding: 0 13px;
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .project-trigger {
    max-width: 40vw;
    margin-left: 0;
  }
  .bubble {
    max-width: 88%;
  }
  .context-facts {
    grid-template-columns: 1fr;
  }
  .conversation {
    width: calc(100vw - 26px);
    max-width: calc(100vw - 26px);
  }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S1</div>
      <div class="brand-copy">
        <strong>SRT-1</strong>
        <span>Bring the idea once. SRT-1 keeps the assistant on task and carries the work to completion.</span>
      </div>
      <button class="project-trigger" id="projectTrigger" type="button" aria-label="Switch project">
        <span class="dot"></span><span id="projectName">SRT-1 Core</span><span>v</span>
      </button>
    </div>
    <div class="top-actions">
      <button class="ghost" id="briefBtn" type="button">Brief me</button>
      <a class="ghost" href="dashboard.html">Control Room</a>
      <div class="avatar">DJ</div>
    </div>
  </header>

  <main class="workspace">
    <section class="conversation" aria-label="SRT-1 Standard Experience">
      <div class="thread" id="thread">
        <div class="message ai">
          <div class="bubble">Welcome back. I am checking the active project before I brief you.</div>
        </div>
      </div>

      <div class="composer">
        <textarea id="composer" placeholder="Tell SRT-1 what you want to create, connect, understand, plan, execute, observe, review, inspect, collaborate, learn, manage, or search..."></textarea>
        <div class="composer-footer">
          <div class="composer-tools">
            <button class="tool" type="button" title="Add project or file" id="attachBtn">+</button>
            <button class="tool" type="button" title="Use current workspace" id="currentBtn">↻</button>
            <button class="tool" type="button" title="More actions" id="actionsBtn">...</button>
          </div>
          <button class="send" id="sendBtn" type="button">Send</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="project-menu" id="projectMenu">
  <div class="menu-label">Projects</div>
  <div id="projectList">
    <button class="project-option" type="button"><span class="dot"></span>Loading projects<small>...</small></button>
  </div>
  <div class="menu-label" style="margin-top:6px">Connect</div>
  <button class="project-option" id="chooseFolderBtn" type="button"><span>+</span>Choose folder<small>Local</small></button>
  <button class="project-option" id="pastePathBtn" type="button"><span>+</span>Paste local path<small>Manual</small></button>
  <button class="project-option" id="useCurrentBtn" type="button"><span class="dot"></span>Use current workspace<small>Now</small></button>
  <button class="project-option" id="githubBtn" type="button"><span>G</span>Connect GitHub<small>Local clone</small></button>
  <div class="path-entry" id="pathEntry">
    <input id="projectPath" placeholder="C:\path\to\project" />
    <button class="card-btn primary" id="openPathBtn" type="button">Open</button>
  </div>
</div>

<input class="hidden" id="fileInput" type="file" />

<script>
const API = window.location.origin && window.location.origin !== 'null' ? window.location.origin : 'http://127.0.0.1:7484';
const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const sendBtn = document.getElementById('sendBtn');
const projectTrigger = document.getElementById('projectTrigger');
const projectMenu = document.getElementById('projectMenu');
const projectName = document.getElementById('projectName');
const projectList = document.getElementById('projectList');
const pathEntry = document.getElementById('pathEntry');
const projectPath = document.getElementById('projectPath');
const fileInput = document.getElementById('fileInput');

let activeQueueSeedId = null;
let latestSummary = {};
let latestWork = {};
let latestRepositories = [];

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function scrollThread() {
  thread.scrollTop = thread.scrollHeight;
}

function addUserMessage(text) {
  thread.insertAdjacentHTML('beforeend', `<div class="message user"><div class="bubble">${esc(text)}</div></div>`);
  scrollThread();
}

function addSystemMessage(text) {
  thread.insertAdjacentHTML('beforeend', `<div class="message ai"><div class="bubble">${esc(text)}</div></div>`);
  scrollThread();
}

function addInsight(text) {
  thread.insertAdjacentHTML('beforeend', `<div class="insight"><b>SRT-1 noticed:</b> ${esc(text)}</div>`);
  scrollThread();
}

function factMarkup(facts = []) {
  if (!facts.length) return '';
  return `<div class="context-facts">${facts.map(fact => `
    <div class="context-fact"><strong>${esc(fact.value)}</strong><span>${esc(fact.label)}</span></div>
  `).join('')}</div>`;
}

function actionMarkup(actions = []) {
  if (!actions.length) return '';
  return `<div class="context-actions">${actions.map(action => {
    const data = { ...(action.data || {}) };
    if (action.command) data.command = action.command;
    const attrs = Object.entries(data).map(([key, value]) => {
      const attr = String(key).replace(/[A-Z]/g, c => '-' + c.toLowerCase());
      return ` data-${esc(attr)}="${esc(value)}"`;
    }).join('');
    const kind = action.kind ? ` data-action-kind="${esc(action.kind)}"` : '';
    const primary = action.primary ? ' primary' : '';
    const danger = action.danger ? ' danger' : '';
    return `<button class="card-btn${primary}${danger}" type="button"${kind}${attrs}>${esc(action.label)}</button>`;
  }).join('')}</div>`;
}

function addContextCard({ title, meta = '', body, facts = [], actions = [], tone = '' }) {
  thread.insertAdjacentHTML('beforeend', `
    <div class="context-card ${esc(tone)}">
      <div class="context-head">
        <div class="context-icon">${tone === 'ready' ? 'OK' : '!'}</div>
        <h3>${esc(title)}</h3>
        ${meta ? `<span class="meta">${esc(meta)}</span>` : ''}
      </div>
      <p>${esc(body)}</p>
      ${factMarkup(facts)}
      ${actionMarkup(actions)}
    </div>
  `);
  bindContextActions();
  scrollThread();
}

function runtimeUrl(port, page = 'experience.html') {
  if (!port) return '';
  return `http://127.0.0.1:${port}/${page}`;
}

async function getJson(path) {
  const response = await fetch(API + path);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

async function postJson(path, body = {}) {
  const response = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || data.message || 'Request failed');
  return data;
}

function projectDisplayName(summary = latestSummary) {
  const active = summary.repository_activation?.active_repository || {};
  return active.name || summary.repo || 'SRT-1 Core';
}

function chooseActiveWork(work = latestWork) {
  const executions = work.executions || [];
  return executions.find(ex => String(ex.status || '').toLowerCase() === 'awaiting_review')
    || executions.find(ex => ['running', 'dispatched', 'ready'].includes(String(ex.status || '').toLowerCase()))
    || executions[0]
    || null;
}

function stageForExecution(execution) {
  const status = String(execution?.status || '').toLowerCase();
  if (status === 'completed') return 'Done';
  if (status === 'awaiting_review' || status === 'returned') return 'Review';
  if (['running', 'dispatched', 'ready', 'pause_requested'].includes(status)) return 'Execution';
  return 'Planning';
}

function syncMission(summary, work) {
  const repo = projectDisplayName(summary);
  const active = chooseActiveWork(work);
  projectName.textContent = repo;
  activeQueueSeedId = active?.queue_seed_id || null;
}

function renderProjectMenu(summary = latestSummary) {
  const activation = summary.repository_activation || {};
  latestRepositories = activation.repositories || [];
  const activeId = activation.active_repository?.repo_id;
  if (!latestRepositories.length) {
    projectList.innerHTML = '<button class="project-option" type="button"><span class="dot"></span>No projects registered<small>Start</small></button>';
    return;
  }
  projectList.innerHTML = latestRepositories.map(repo => `
    <button class="project-option" type="button" data-project-id="${esc(repo.repo_id)}" data-runtime-port="${esc(repo.runtime_port || '')}">
      <span class="dot" style="background:${repo.repo_id === activeId ? 'var(--brand)' : '#495362'}"></span>
      ${esc(repo.name || 'Project')}
      <small>${repo.repo_id === activeId ? 'Active' : (repo.runtime_port ? `:${repo.runtime_port}` : 'Registered')}</small>
    </button>
  `).join('');
  projectList.querySelectorAll('[data-project-id]').forEach(button => {
    button.addEventListener('click', () => switchProject(button.dataset.projectId, button.dataset.runtimePort));
  });
}

function renderSessionBrief(summary = latestSummary, work = latestWork) {
  const executions = work.executions || [];
  const active = chooseActiveWork(work);
  const waiting = executions.filter(ex => String(ex.status || '').toLowerCase() === 'awaiting_review').length;
  const running = executions.filter(ex => ['running', 'dispatched', 'ready'].includes(String(ex.status || '').toLowerCase())).length;
  const repo = projectDisplayName(summary);

  thread.innerHTML = '';
  addSystemMessage(`Welcome back. I checked ${repo} and restored the Standard Experience around the active conversation.`);

  if (waiting) {
    addContextCard({
      title: waiting === 1 ? 'One thing needs your attention' : `${waiting} things need your attention`,
      meta: active?.objective || repo,
      body: active?.objective
        ? `${active.objective} is waiting for your decision.`
        : 'SRT-1 found work waiting for your decision.',
      tone: 'warn',
      facts: [
        { label: 'Reviews waiting', value: String(waiting) },
        { label: 'Active work', value: running ? String(running) : 'None' },
        { label: 'Stage', value: stageForExecution(active) }
      ],
      actions: [
        { label: 'Review', primary: true, kind: 'review' },
        { label: 'Explain', kind: 'explain' },
        { label: 'Approve', kind: 'workcell-action', data: { workcellAction: 'approve' } },
        { label: 'Send back', kind: 'workcell-action', data: { workcellAction: 'reject' } },
        { label: 'Inspect technical details', kind: 'control-room' }
      ]
    });
  } else if (active) {
    addContextCard({
      title: 'Current work restored',
      meta: repo,
      body: `${active.objective || 'Active work'} is available in this conversation. Tell SRT-1 the outcome you want next.`,
      tone: 'ready',
      facts: [
        { label: 'Stage', value: stageForExecution(active) },
        { label: 'Status', value: active.status || 'ready' },
        { label: 'Verification', value: active.verification_state || 'not reported' }
      ],
      actions: [
        { label: 'Continue', primary: true, kind: 'quick', command: 'Continue the active work.' },
        { label: 'Show progress', kind: 'quick', command: 'Show progress.' },
        { label: 'Pause', kind: 'workcell-action', data: { workcellAction: 'pause' } }
      ]
    });
  } else {
    addContextCard({
      title: 'Start with the project outcome',
      meta: repo,
      body: 'Tell SRT-1 what you want to build, understand, plan, or review. SRT-1 will create or find the right work path behind the conversation.',
      tone: 'ready',
      facts: [
        { label: 'Project', value: repo },
        { label: 'Work waiting', value: 'None' },
        { label: 'Next step', value: 'Ask SRT-1' }
      ],
      actions: [
        { label: 'Explain this project', kind: 'quick', command: 'Explain this project.' },
        { label: 'Create a plan', kind: 'quick', command: 'Create a plan for this project.' },
        { label: 'Add project', kind: 'add-project' }
      ]
    });
  }

  addInsight('Reviews, verification, project intelligence, and assistant activity will appear here only when they matter to the current conversation.');
  addSystemMessage('What would you like me to do next?');
}

async function loadWorkspace({ preserveThread = false } = {}) {
  try {
    const [summary, work] = await Promise.all([
      getJson('/dashboard-summary'),
      getJson('/api/v1/workcells')
    ]);
    latestSummary = summary;
    latestWork = work;
    syncMission(summary, work);
    renderProjectMenu(summary);
    if (!preserveThread) renderSessionBrief(summary, work);
  } catch (error) {
    addSystemMessage(`SRT-1 runtime is not reachable at ${API}. Start the local runtime, then refresh this workspace.`);
  }
}

async function loadConversation() {
  if (!activeQueueSeedId) {
    addSystemMessage('There is no active WorkCell conversation yet. Tell me the mission outcome and I will create or route the work behind the scenes.');
    return;
  }
  try {
    const data = await getJson('/api/v1/workcells/' + encodeURIComponent(activeQueueSeedId) + '/messages?limit=30');
    const messages = (data.messages || []).slice().reverse();
    if (!messages.length) {
      addSystemMessage('This work is ready for conversation, but no prior messages were recorded.');
      return;
    }
    thread.innerHTML = '';
    messages.forEach(message => {
      const role = String(message.role || '').toLowerCase();
      if (role === 'user') addUserMessage(message.content || '');
      else addSystemMessage(message.content || '');
    });
  } catch (error) {
    addSystemMessage(error.message || 'Could not load that conversation.');
  }
}

function classifyOwnerIntent(text) {
  const l = text.toLowerCase();
  for (const [intent, phrases] of Object.entries(OWNER_INTENTS)) {
    if (phrases.some(phrase => l.includes(phrase))) return intent;
  }
  if (['build', 'start', 'create', 'generate', 'brainstorm'].some(term => l.includes(term))) return 'create';
  if (['open', 'connect', 'upload', 'folder', 'workspace', 'github'].some(term => l.includes(term))) return 'connect';
  if (['explain', 'architecture', 'module', 'file', 'function', 'dependencies', 'broken'].some(term => l.includes(term))) return 'understand';
  if (['plan', 'tasks', 'estimate', 'prioritize', 'milestone'].some(term => l.includes(term))) return 'plan';
  if (['continue', 'implement', 'fix', 'refactor', 'tests', 'finish', 'clean'].some(term => l.includes(term))) return 'execute';
  if (['progress', 'active work', 'blocked', 'completed', 'working'].some(term => l.includes(term))) return 'observe';
  if (['review', 'approve', 'reject', 'safe', 'changed'].some(term => l.includes(term))) return 'review';
  if (['control room', 'workcell', 'manifest', 'logs', 'verification', 'constellation'].some(term => l.includes(term))) return 'inspect';
  if (['codex', 'claude', 'gemini', 'assistant', 'slack', 'team'].some(term => l.includes(term))) return 'collaborate';
  if (['learned', 'mistakes', 'patterns', 'remember', 'methodology', 'knowledge'].some(term => l.includes(term))) return 'learn';
  if (['pause', 'resume', 'archive', 'duplicate', 'rename', 'delete', 'move', 'reopen'].some(term => l.includes(term))) return 'manage';
  if (['find', 'search'].some(term => l.includes(term))) return 'search';
  return 'conversation';
}

async function handleIntent(text) {
  const intent = classifyOwnerIntent(text);
  const l = text.toLowerCase();
  await loadWorkspace({ preserveThread: true });
  if (intent === 'inspect') {
    addContextCard({
      title: 'Control Room is ready',
      body: 'Open the technical surface when you want the machinery. This Standard Experience stays focused on conversation.',
      actions: [{ label: 'Open Control Room', primary: true, kind: 'control-room' }]
    });
    return;
  }
  if (intent === 'connect') {
    showConnectorStatus(text);
    return;
  }
  if (intent === 'review' && l.includes('approve')) {
    await controlActiveWork('approve');
    return;
  }
  if (intent === 'review' && (l.includes('send back') || l.includes('reject') || l.includes('return'))) {
    await controlActiveWork('reject');
    return;
  }
  if (intent === 'manage' && l.includes('pause')) {
    await controlActiveWork('pause');
    return;
  }
  if ((intent === 'manage' && l.includes('resume')) || (intent === 'execute' && l.includes('continue'))) {
    await continueActiveWork();
    return;
  }
  if (intent === 'review') {
    showReviewContext();
    return;
  }
  if (['create', 'plan', 'execute'].includes(intent)) {
    await createWorkFromIntent(text);
    return;
  }
  if (['understand', 'observe'].includes(intent)) {
    showProjectBrief();
    return;
  }
  if (intent === 'collaborate') {
    showCollaborationStatus(text);
    return;
  }
  if (intent === 'learn') {
    saveLearningIntent(text);
    return;
  }
  if (intent === 'search') {
    searchConversationAndState(text);
    return;
  }
  if (intent === 'manage') {
    addContextCard({
      title: 'Project management request',
      body: 'Pause and resume are live for active WorkCells. Archive, duplicate, rename, delete, move, merge, and reopen need project lifecycle backend routes before I can safely execute them here.',
      facts: [
        { label: 'Live now', value: 'Pause/resume work' },
        { label: 'Needs route', value: 'Project lifecycle' },
        { label: 'Safety', value: 'No fake mutation' }
      ],
      actions: [
        { label: 'Pause active work', kind: 'workcell-action', data: { workcellAction: 'pause' } },
        { label: 'Resume active work', kind: 'workcell-action', data: { workcellAction: 'resume' } },
        { label: 'Open Control Room', kind: 'control-room' }
      ]
    });
    return;
  }
  addSystemMessage('I recorded that in this conversation. If you want execution, say build, fix, plan, continue, pause, review, approve, or send back.');
}

async function sendMessage() {
  const text = composer.value.trim();
  if (!text) return;
  addUserMessage(text);
  composer.value = '';
  if (activeQueueSeedId) {
    try {
      await postJson('/api/v1/workcells/' + encodeURIComponent(activeQueueSeedId) + '/chat', {
        role: 'user',
        content: text,
        channel: 'standard_experience',
        actor: 'standard_experience_user'
      });
    } catch (error) {
      addSystemMessage(error.message || 'I could not attach that message to the active WorkCell.');
      return;
    }
  }
  await handleIntent(text);
}

function bindContextActions() {
  thread.querySelectorAll('[data-action-kind]').forEach(button => {
    if (button.dataset.bound) return;
    button.dataset.bound = 'true';
    button.addEventListener('click', () => {
      const kind = button.dataset.actionKind;
      if (kind === 'quick') {
        composer.value = button.dataset.command || button.textContent;
        sendMessage();
      } else if (kind === 'review') {
        loadConversation();
      } else if (kind === 'explain') {
        addSystemMessage('This item needs your decision because SRT-1 has work in a reviewable state. I can explain the change, show verification, or send it back.');
      } else if (kind === 'control-room') {
        window.location.href = 'dashboard.html';
      } else if (kind === 'open-url') {
        const url = button.dataset.url;
        if (url) window.location.href = url;
      } else if (kind === 'add-project') {
        projectMenu.classList.add('open');
      } else if (kind === 'choose-folder') {
        chooseFolder();
      } else if (kind === 'paste-path') {
        projectMenu.classList.add('open');
        pathEntry.classList.add('open');
        projectPath.focus();
      } else if (kind === 'attach-file') {
        fileInput.click();
      } else if (kind === 'use-current') {
        registerCurrent();
      } else if (kind === 'workcell-action') {
        controlActiveWork(button.dataset.workcellAction || 'pause');
      }
    });
  });
}

async function controlActiveWork(action) {
  if (!activeQueueSeedId) {
    addSystemMessage('There is no active work item to control yet.');
    return;
  }
  addUserMessage(action === 'reject' ? 'Send it back' : action.charAt(0).toUpperCase() + action.slice(1));
  try {
    const result = await postJson('/api/v1/workcells/' + encodeURIComponent(activeQueueSeedId) + '/action', {
      action,
      actor: 'standard_experience_user',
      reason: 'Decision from Standard Experience conversation.'
    });
    addSystemMessage(result.error || result.message || `SRT-1 recorded ${action} for the active work.`);
    await loadWorkspace({ preserveThread: true });
  } catch (error) {
    addSystemMessage(error.message || `Could not ${action} the active work.`);
  }
}

async function switchProject(repoId, runtimePort) {
  projectMenu.classList.remove('open');
  const repo = latestRepositories.find(item => item.repo_id === repoId);
  if (!repo) return;
  addUserMessage(`Open ${repo.name}`);
  if (repo.active) {
    addSystemMessage(`You are already in ${repo.name}. I restored its current conversation.`);
    await loadWorkspace();
    return;
  }
  if (runtimePort) {
    addSystemMessage(`${repo.name} already has a runtime on port ${runtimePort}. Open that runtime to restore its conversation from its own state.`);
    addContextCard({
      title: 'Project runtime available',
      meta: repo.name,
      body: 'This project is registered outside the current SRT-1 Core engine. Its own runtime should own the conversation.',
      actions: [
        { label: 'Open project workspace', primary: true, kind: 'open-url', data: { url: runtimeUrl(runtimePort) } },
        { label: 'Open project Control Room', kind: 'open-url', data: { url: runtimeUrl(runtimePort, 'dashboard.html') } }
      ]
    });
    return;
  }
  try {
    const result = await postJson('/api/v1/repositories/launch', { repo_id: repoId });
    addContextCard({
      title: result.status === 'ready' ? 'Project already open' : 'Project runtime launching',
      meta: repo.name,

    addSystemMessage(error.message || 'Could not launch that project runtime.');

async function handleFileAttachment(file) {
  if (!file) return;
  addUserMessage(`Attach file: ${file.name}`);
  let preview = '';
  try {
    const text = await file.text();
    preview = text.slice(0, 1800);
  } catch (error) {
    preview = '[Binary file or unreadable text payload]';
  }
  const context = [
    `Attached file: ${file.name}`,
    `Size: ${Math.max(1, Math.round(file.size / 1024))} KB`,
    `Type: ${file.type || 'unknown'}`,
    '',
    preview

  if (activeQueueSeedId) {
    try {
      await postJson('/api/v1/workcells/' + encodeURIComponent(activeQueueSeedId) + '/chat', {
        role: 'user',
        content: context,
        channel: 'standard_experience_attachment',
        actor: 'standard_experience_user',
        metadata: {
          filename: file.name,
          size: file.size,
          type: file.type || 'unknown'

      addSystemMessage(error.message || 'I could not attach that file to the active WorkCell conversation.');
      return;

  addContextCard({
    title: 'File added to the conversation',
    meta: file.name,
    body: activeQueueSeedId
      ? 'I recorded this file as context on the active WorkCell conversation.'
      : 'I read this file locally and added it to the current conversation. Start or choose active work when you want it routed to a WorkCell.',
    tone: 'ready',
    facts: [
      { label: 'File', value: file.name },
      { label: 'Size', value: `${Math.max(1, Math.round(file.size / 1024))} KB` },
      { label: 'Route', value: activeQueueSeedId ? 'Active WorkCell' : 'Conversation only' }
    ],
    actions: [
      { label: 'Explain this file', primary: true, kind: 'quick', command: `Explain the attached file ${file.name}.` },
      { label: 'Use it for planning', kind: 'quick', command: `Use ${file.name} to plan the next work.` }
    ]
  });
}

async function registerPath() {
  const path = projectPath.value.trim();
  if (!path) {
    pathEntry.classList.add('open');
    projectPath.focus();
    return;
  }
  projectMenu.classList.remove('open');
  addUserMessage(`Open ${path}`);
  try {
    const result = await postJson('/api/v1/repositories/register-path', { path });
    const registered = result.registered_repository || result.active_repository || {};
    addContextCard({
      title: result.status === 'ready' ? 'Project ready' : 'Project registered',
      meta: registered.name || 'Project',
      body: result.status === 'ready'
        ? 'SRT-1 opened this project in the active conversation.'
        : 'SRT-1 registered that folder. If it belongs to a different project, launch its runtime before asking SRT-1 to reason from its files.',
      facts: [
        { label: 'Project', value: registered.name || 'Project' },
        { label: 'State', value: result.status || 'registered' },
        { label: 'Runtime', value: registered.runtime_port || 'Not open yet' }
      ],
      actions: registered.repo_id ? [{ label: 'Launch project runtime', primary: true, kind: 'launch', data: { repoId: registered.repo_id } }] : []
    });
    await loadWorkspace({ preserveThread: true });
  } catch (error) {
    addSystemMessage(error.message || 'Project registration failed.');
  }
}

async function chooseFolder() {
  projectMenu.classList.remove('open');
  addUserMessage('Choose a project folder');
  addSystemMessage('I am opening the folder connector. When the folder is selected, I will keep the next step in this conversation.');
  try {
    const result = await postJson('/api/v1/repositories/browse-folder', {});
    if (result.status === 'cancelled') {
      addSystemMessage('No folder was selected. We stayed in this workspace.');
      return;
    }
    await loadWorkspace({ preserveThread: true });
    const registered = result.registered_repository || result.active_repository || {};
    addContextCard({
      title: result.status === 'ready' ? 'Project ready' : 'Project registered',
      meta: registered.name || 'Project',
      body: result.status === 'ready'
        ? 'SRT-1 opened the selected project and can continue from this workspace.'
        : 'SRT-1 registered the selected folder. Launch the project runtime before expecting project-specific understanding.',
      actions: registered.repo_id ? [{ label: 'Launch project runtime', primary: true, kind: 'launch', data: { repoId: registered.repo_id } }] : []
    });
  } catch (error) {
    addSystemMessage(error.message || 'Folder chooser is unavailable. Paste the folder path instead.');
    pathEntry.classList.add('open');
  }
}

async function launchProject(repoId) {
  if (!repoId) return;
  addUserMessage('Launch project runtime');
  try {
    const result = await postJson('/api/v1/repositories/launch', { repo_id: repoId });
    addContextCard({
      title: result.status === 'ready' ? 'Project already open' : 'Project runtime launching',
      meta: result.registered_repository?.name || 'Project',
      body: result.message || 'SRT-1 started the runtime responsible for that project.',
      facts: [
        { label: 'Runtime', value: result.runtime_port || 'Starting' },
        { label: 'State', value: result.status || 'launching' }
      ],
      actions: result.runtime_port
        ? [
            { label: 'Open project workspace', primary: true, kind: 'open-url', data: { url: runtimeUrl(result.runtime_port) } },
            { label: 'Open project Control Room', kind: 'open-url', data: { url: runtimeUrl(result.runtime_port, 'dashboard.html') } }
          ]
        : [{ label: 'Open Control Room', kind: 'control-room' }]
    });
  } catch (error) {
    addSystemMessage(error.message || 'Project runtime launch failed.');
  }
}

document.addEventListener('click', event => {
  const launchButton = event.target.closest('[data-action-kind="launch"]');
  if (launchButton) {
    launchProject(launchButton.dataset.repoId);
    return;
  }
});

sendBtn.addEventListener('click', sendMessage);
composer.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

projectTrigger.addEventListener('click', event => {
  event.stopPropagation();
  projectMenu.classList.toggle('open');
});

projectMenu.addEventListener('click', event => event.stopPropagation());
document.addEventListener('click', () => projectMenu.classList.remove('open'));

document.getElementById('briefBtn').addEventListener('click', () => renderSessionBrief(latestSummary, latestWork));
document.getElementById('attachBtn').addEventListener('click', openAttachmentChoices);
document.getElementById('actionsBtn').addEventListener('click', openActionChoices);
document.getElementById('currentBtn').addEventListener('click', registerCurrent);
document.getElementById('useCurrentBtn').addEventListener('click', registerCurrent);
document.getElementById('chooseFolderBtn').addEventListener('click', chooseFolder);
document.getElementById('pastePathBtn').addEventListener('click', () => {
  pathEntry.classList.toggle('open');
  projectPath.focus();
});
document.getElementById('openPathBtn').addEventListener('click', registerPath);
document.getElementById('githubBtn').addEventListener('click', () => {
  projectMenu.classList.remove('open');
  addSystemMessage('GitHub import will use this same conversation flow when the connector is available. For now, clone the repository locally and choose that folder.');
});
fileInput.addEventListener('change', () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  handleFileAttachment(file);
});

loadWorkspace();
</script>
</body>
</html>
