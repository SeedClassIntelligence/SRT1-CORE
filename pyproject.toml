[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SRT1-CORE"
version = "2.3.3"
description = "SRT-1 Core: repo-continuity and alignment support for AI coding assistants."
readme = "README.md"
license = {text = "BSL 1.1"}
requires-python = ">=3.9"
authors = [
    {name = "William Darnell Jernigan IV"}
]
keywords = [
    "scia", "srt-1", "code-indexer", "anti-hallucination",
    "static-analysis", "ai-governance",
    "code-assistant", "context-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://srt1.io"
Documentation = "https://srt1.io/documentation.html"
Repository = "https://github.com/SeedClassIntelligence/SRT1-CORE"

[project.scripts]
srt1-index = "srt1_code_indexer.engine:main"
srt1-engine = "srt1_code_indexer.engine:main"
srt1-code-indexer = "srt1_code_indexer.engine:main"
srt1-bundle = "srt1_pro.context_bundler:main"
srt1-middleware = "srt1_code_indexer.engine:main"
srt1-mcp = "srt1_platform.mcp_server:main"

[project.optional-dependencies]
pro = []
platform = []
all = []

[tool.setuptools.packages.find]
include = ["srt1_code_indexer*", "srt1_pro*", "srt1_platform*"]
exclude = ["srt1_code_indexer_pkg*"]

[tool.setuptools.package-data]
srt1_platform = ["pwa/*.html", "pwa/**/*.js", "pwa/**/*.css", "pwa/**/*.json", "pwa/**/*.png", "pwa/**/*.svg", "pwa/**/*.woff2", "mobile/*.html"]

